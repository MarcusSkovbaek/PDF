# Builds the Windows installer (FolioPDF-Setup-<version>.exe) on a clean
# Windows machine and attaches it to the run as a downloadable artifact.
# Only the build uses the internet (to install the build tools); the program
# itself never does.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["claude/happy-wozniak-yin6iu", "main", "master"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build program (PyInstaller)
        run: pyinstaller packaging/folio.spec --noconfirm --clean

      - name: Smoke test the built program
        shell: pwsh
        run: |
          python -c "from tests.conftest import make_sample_pdf; make_sample_pdf('smoke.pdf')"
          $p = Start-Process -FilePath dist\FolioPDF\FolioPDF.exe -ArgumentList '--screenshot','smoke.png','--size','1280x800','smoke.pdf' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "FolioPDF.exe exited with $($p.ExitCode)" }
          if (-not (Test-Path smoke.png)) { throw "no screenshot written" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = python -c "import pdfstudio; print(pdfstudio.__version__)"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Smoke test the installer (silent install + start)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\FolioPDF-Setup-*.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/CURRENTUSER','/NORESTART','/DIR=C:\FolioTest' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $q = Start-Process -FilePath C:\FolioTest\FolioPDF.exe -ArgumentList '--screenshot','installed.png','smoke.pdf' -PassThru -Wait
          if ($q.ExitCode -ne 0 -or -not (Test-Path installed.png)) { throw "installed program did not start" }

      - uses: actions/upload-artifact@v4
        with:
          name: FolioPDF-Setup
          path: dist/FolioPDF-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: "*.png"
